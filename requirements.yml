functional:
  - Пользователь может зарегистрироваться и авторизоваться, в том числе через GitHub.
  - Пользователь может играть без регистрации в режиме гостя.
  - Пользователь может создать игру: со случайным соперником, с ботом, с другом по ссылке.
  - Оба игрока получают одну и ту же задачу.
  - Игрок выбирает язык программирования перед началом поединка.
  - Побеждает тот, кто первым отправил решение, прошедшее все тесты.
  - Каждый участник видит код соперника в реальном времени.
  - Участники и зрители могут общаться в чате.
  - Пользователь может сдаться и запросить реванш.
  - Система ведёт рейтинг и таблицу лидеров.
  - Система сохраняет историю игр и личную статистику.
  - Пользователь может наблюдать за чужими играми в прямом эфире.
  - Поддерживаются турниры.
  - Пользователь может редактировать профиль и настройки.

non-functional:
  - Сайт быстро открывается, задержка трансляции кода 1–2 секунды.
  - Интерфейс удобен и интуитивно понятен.
  - Сайт безопасен: HTTPS, защита данных, защита от XSS.
  - Сайт адаптивен для мобильных устройств.
  - Сайт работает в современных браузерах.
  - Система выдерживает около 1000 одновременных пользователей.
  - Состояние игры синхронизируется в реальном времени без потери данных.

implicit:
  - Интерфейс поддерживает минимум русский и английский языки.
  - Код соперника виден только участникам игры.
  - Гость не теряет прогресс.
  - Игра корректно завершается при выходе соперника.
  - Чат модерируется.
  - Базовая игра бесплатна.
