  prerequisites: |
    Доступ к сайту; пользователь авторизован; открыт чат
  test-data: |
    XSS-пейлоад: `<script>alert('x')</script>`
  steps:
    - Вставить пейлоад в поле чата и отправить сообщение.
    - Проверить отображение отправленного сообщения.
    - Перезагрузить страницу и снова проверить отображение сообщения в истории чата.
  expected-result: |
    Скрипт не исполняется (окно alert не появляется)
    Сообщение отображается как обычный текст, включая историю после перезагрузки


  - summary: |
    Проверка адаптивности на мобильном разрешении
  requirement: |
    Сайт адаптивен для мобильных устройств
  prerequisites: |
    Мобильное устройство или эмуляция разрешения в DevTools
  test-data: |
    Разрешение: 375×667 (iPhone SE)
  steps:
    - Открыть главную страницу сайта на разрешении 375×667.
    - Проверить отсутствие горизонтальной прокрутки.
    - Проверить, что элементы не накладываются друг на друга и вёрстка не ломается.
    - Нажать основные кнопки: начать игру, открыть чат — убедиться, что они доступны и кликабельны.
  expected-result: |
    Горизонтальная прокрутка отсутствует
    Элементы не накладываются, вёрстка не ломается
    Основные кнопки видны и нажимаются на мобильном экране


