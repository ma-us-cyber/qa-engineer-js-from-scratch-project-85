  - summary: |
    Нагрузочное тестирование: около 1000 одновременных пользователей
  requirement: |
    Система выдерживает около 1000 одновременных пользователей
  prerequisites: |
    Тестовый стенд; настроенный инструмент нагрузочного тестирования (k6, JMeter, Locust)
  test-data: |
    1000 виртуальных пользователей; профиль нагрузки: вход, создание игр, отправка решений, чат
  steps:
    - Запустить нагрузочный тест с 1000 одновременных пользователей.
    - В течение теста мониторить время отклика, ошибки 5xx и потребление ресурсов сервера.
  expected-result: |
    При 1000 одновременных пользователях нет ошибок 5xx
    Сервис работает стабильно в течение всего теста
    Время отклика не выходит за допустимые пределы


  - summary: |
    Синхронизация состояния игры между двумя игроками
  requirement: |
    Изменения состояния игры отображаются у второго игрока в реальном времени
  prerequisites: |
    Два игрока в активной комнате
  steps:
    - Игрок A вносит изменение в код решения.
    - Наблюдать экран игрока B.
  expected-result: |
    Код у игрока B обновляется автоматически, без перезагрузки страницы
    Таймер и статусы игры отображаются у обоих игроков одинаково


  - summary: |
    Восстановление состояния игры после обрыва соединения
  requirement: |
    Состояние игры восстанавливается после временной потери соединения без потери данных
  prerequisites: |
    Два игрока в активной комнате; возможность кратковременно отключить сеть одного игрока
  steps:
    - Игрок A вносит изменение в код.
    - У игрока B прервать соединение на 5–10 секунд и восстановить его.
    - Проверить состояние игры у игрока B после переподключения.
    - Продолжить игру и отправить решение.
  expected-result: |
    После переподключения состояние игры синхронизировано с актуальным
    Данные не потеряны и не задублированы
    Игра продолжается без перезапуска комнаты


  - summary: |
    Проверка переключения языка интерфейса
  requirement: |
    Интерфейс поддерживает минимум русский и английский языки
  prerequisites: |
    Авторизованный пользователь; открыт раздел настроек
  steps:
    - Переключить язык интерфейса на русский.
    - Проверить основные экраны: лобби и профиль.
    - Переключить язык интерфейса на английский.
    - Повторить проверку основных экранов.
  expected-result: |
    Язык интерфейса переключается
    Лобби и профиль отображаются на выбранном языке
    Нет непереведённых строк
    Вёрстка не ломается


  - summary: |
    Недоступность кода игры для неучастников в интерфейсе
  requirement: |
    Код игры виден только участникам игры
  prerequisites: |
    Активная игра двух игроков; второй авторизованный пользователь, не участвующий в игре
  steps:
    - Открыть страницу активной игры от имени неучастника.
    - Проверить, что код игроков не отображается.
  expected-result: |
    Код игроков не отображается в интерфейсе
    Неучастнику доступны только общие данные игры (счёт, таймер, статусы)


  - summary: |
    Сохранение состояния игры у гостя после перезагрузки страницы
  requirement: |
    Гость сохраняет состояние текущей игры после перезагрузки страницы
  prerequisites: |
    Гость находится в активной игре
  steps:
    - Гость начинает игру и вводит часть решения.
    - Перезагрузить страницу.
    - Проверить восстановление состояния игры.
  expected-result: |
    После перезагрузки гость возвращается в ту же игру
    Введённый код сохраняется
    Состояние игры восстанавливается



