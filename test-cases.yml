- summary: |
    Успешная авторизация через GitHub в Codebattle
  requirement: |
    Пользователь может зарегистрироваться и авторизоваться, в том числе через GitHub
  prerequisites: |
    Открыта страница входа Codebattle, есть активный GitHub-аккаунт
  test-data: |
    Аккаунт GitHub пользователя.
  steps:
    - На странице входа нажать «Sign in with GitHub».
    - В окне GitHub подтвердить доступ (разрешить доступ к email и профилю).
    - Дождаться возврата в Codebattle.
  expected-result: 
    Пользователь авторизован и попадает в Codebattle

  - summary: |
    Успешная регистрация и авторизация по email и паролю
  requirement: |
    Пользователь может зарегистрироваться и авторизоваться по email и паролю
  prerequisites: |  
    Открыта страница регистрации Codebattle
  test-data: | 
    Email: test_user@example.com, пароль: Qwerty123!
  steps: 
  - Открыть форму регистрации, ввести email и пароль, подтвердить.
  - Выйти из аккаунта.
  - Открыть форму входа и ввести те же email и пароль.
  expected-result: |
    Аккаунт создан; после выхода повторный вход выполняется успешно, пользователь попадает в лобби

  - summary: |
    Отмена авторизации через GitHub
  requirement: 
    Пользователь может зарегистрироваться и авторизоваться, в том числе через GitHub
  prerequisites: |
    Открыта страница входа Codebattle, есть активный GitHub-аккаунт
  test-data: |
    Аккаунт GitHub пользователя
  steps: 
    - На странице входа нажать «Sign in with GitHub».
    - В окне авторизации GitHub нажать «Cancel».
  expected-result: |
    Пользователь возвращается на страницу входа Codebattle
    Авторизация не выполняется
    Отображается понятное сообщение об отмене входа или ошибки нет

  - summary: |
    Вход с неверным паролем
  requirement: |
    Авторизация по email и паролю
  prerequisites: |
    Пользователь зарегистрирован; открыта форма входа
  test-data: |
    Email: корректный
    пароль: неверный
  steps:
    - Ввести корректный email.
    - Ввести неверный пароль.
    - Нажать «Войти».
  expected-result: 
    Вход не выполнен.


- summary: |
    Успешное редактирование профиля 
  requirement: |
    Пользователь может редактировать профиль
  prerequisites: |
    Пользователь авторизован; открыт экран «Профиль»
  test-data: |
    Новый ник: ProCoder42; Файл аватара до 2 МБ (png/jpg)
  steps:
    - Изменить ник на новое значение.
    - Загрузить новый аватар.
    - Нажать «Сохранить».
  expected-result: |
    Данные профиля обновлены
    Новый ник и аватар сохранены


  - summary: |
    Успешное изменение настроек интерфейса 
  requirement: |
    Пользователь может редактировать настройки
  prerequisites: |
    Пользователь авторизован; открыт экран «Настройки»
  test-data: |
    Выбранная тема интерфейса
  steps:
    - Переключить тему интерфейса (светлая/тёмная).
    - Нажать «Сохранить».
  expected-result: 
    Выбранная тема интерфейса применена


- summary: |
    Игра без регистрации в режиме гостя 
  requirement: |
    Пользователь может играть без регистрации в режиме гостя
  prerequisites: |
    Пользователь не авторизован; открыта главная страница
  test-data: |
    нет
  steps:
    - Нажать «Быстрая игра» / «Играть как гость».
    - Выбрать язык программирования.
    - Дождаться старта игры.
  expected-result: |
    Игра начинается без авторизации
    Пользователю присваивается временный ник
    Открывается экран игры


  - summary: |
    Создание игры со случайным соперником
  requirement: |
    Пользователь может создать игру: со случайным соперником
  prerequisites: |
    Пользователь в лобби; есть активные соперники в поиске
  test-data: |
    Язык: Python; сложность: easy
  steps:
    - Выбрать «Быстрая игра», указать язык и сложность.
    - Нажать «Начать».
    - Дождаться подбора соперника.
  expected-result: |
    Создана игровая комната 
    Найден соперник
    Обоим игрокам выдана задача
    Таймер запущен
